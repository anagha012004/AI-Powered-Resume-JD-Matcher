[project]
name = "resume-matcher-backend"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",
    "pdfplumber==0.11.0",
    "sentence-transformers==3.0.1",
    "google-generativeai==0.7.2",
    "sqlalchemy==2.0.30",
    "aiosqlite==0.20.0",
    "redis==5.0.7",
    "celery==5.4.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "python-dotenv==1.0.1",
    "httpx==0.27.0",
    "scikit-learn>=1.5.0",
    "torch>=2.0.0",
    "openai>=2.44.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt==4.0.1",
    "reportlab>=4.1.0",
]

[dependency-groups]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
]
