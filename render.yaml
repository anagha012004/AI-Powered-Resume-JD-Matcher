services:
  - type: web
    name: resume-matcher-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: cd apps/backend && pip install -r requirements.txt && python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"
    startCommand: cd apps/backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: resume-matcher-redis
          property: connectionString
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: resume-matcher-db
          property: connectionString
      - key: LOW_SIMILARITY_THRESHOLD
        value: "0.25"
      - key: CACHE_TTL
        value: "86400"
    healthCheckPath: /health

  - type: pserv
    name: resume-matcher-db
    region: oregon
    plan: free
    databaseName: resume_matcher
    databaseUser: resume_matcher_user

  - type: redis
    name: resume-matcher-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow connections
